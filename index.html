<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Circlo - Real App</title>
    <style>
        /* --- CSS REMAINS THE SAME --- */
        :root {
            --bg-body: #121220; --bg-card: #1e1e2d; --bg-nav: #1a1a2e; --text-main: #ffffff;
            --text-muted: #a0a0b0; --accent: #5D9CEC; --border-color: #2a2a3e;
            --danger: #e74c3c; --success: #2ecc71; --warning: #f1c40f;
        }
        body.light-mode { --bg-body: #f0f2f5; --bg-card: #ffffff; --bg-nav: #ffffff; --text-main: #333333; --text-muted: #666666; --border-color: #ddd; --danger: #d9534f; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background-color 0.3s, color 0.3s; }
        body { background-color: var(--bg-body); color: var(--text-main); display: flex; justify-content: center; height: 100vh; overflow: hidden; }
        #app-container { width: 100%; max-width: 480px; height: 100vh; background-color: var(--bg-body); position: relative; display: flex; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background-color: var(--bg-nav); border-bottom: 1px solid var(--border-color); z-index: 10; gap: 10px; }
        .header-left { display: flex; align-items: center; gap: 5px; flex: 1; }
        .header-title { font-size: 20px; font-weight: bold; color: var(--accent); }
        .header-icons { display: flex; gap: 15px; font-size: 20px; cursor: pointer; }
        .back-btn { background: none; border: none; color: var(--accent); font-size: 26px; cursor: pointer; font-weight: bold; padding: 0 10px; display: none; line-height: 1; }
        
        #main-view { flex: 1; overflow-y: auto; padding-bottom: 80px; }
        .view-section { display: none; padding: 15px; }
        .view-section.active { display: block; }

        /* AUTH */
        .auth-container { padding: 30px; display: flex; flex-direction: column; justify-content: center; height: 100vh; }
        .auth-logo { font-size: 40px; font-weight: bold; color: var(--accent); text-align: center; margin-bottom: 5px; }
        .auth-tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); }
        .auth-tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; font-weight: bold; color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -2px; }
        .auth-tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 12px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-size: 15px; outline: none; }
        .auth-btn { width: 100%; padding: 15px; background: var(--accent); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .auth-error { color: var(--danger); font-size: 14px; text-align: center; margin-bottom: 15px; display: none; }

        /* NAV */
        .bottom-nav { position: absolute; bottom: 0; width: 100%; height: 70px; background: var(--bg-nav); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; padding-bottom: 5px; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); font-size: 11px; cursor: pointer; flex: 1; height: 100%; gap: 4px; }
        .nav-item.active { color: var(--accent); }
        .nav-icon { font-size: 22px; }
        .nav-add { position: relative; top: -20px; }
        .nav-add .add-circle { width: 55px; height: 55px; background: var(--accent); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 30px; color: white; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.2); border: 4px solid var(--bg-body); }

        /* POSTS */
        .post-card { background: var(--bg-card); border-radius: 12px; margin-bottom: 20px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .post-header { display: flex; align-items: center; padding: 12px; gap: 10px; }
        .post-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); display: flex; justify-content: center; align-items: center; font-weight: bold; color: white; overflow: hidden; }
        .post-user-info { flex: 1; }
        .post-user-info strong { font-size: 15px; display: block; }
        .post-media-single { width: 100%; max-height: 300px; background: #000; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .post-media-single img { width: 100%; height: auto; max-height: 300px; object-fit: cover; }
        .post-actions { display: flex; gap: 15px; padding: 12px; align-items: center; }
        .action-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-main); }
        .post-info { padding: 0 12px 12px 12px; }
        .post-info h4 { font-size: 15px; margin-bottom: 5px; }
        .post-info p { font-size: 14px; color: var(--text-muted); line-height: 1.4; }

        /* CHAT */
        .search-bar { width: 100%; padding: 12px 15px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; color: var(--text-main); outline: none; font-size: 14px; margin-bottom: 15px; }
        .list-item { display: flex; align-items: center; gap: 15px; padding: 15px; background: var(--bg-card); border-radius: 10px; margin-bottom: 10px; cursor: pointer; }
        .list-avatar { width: 45px; height: 45px; border-radius: 50%; background: var(--accent); display: flex; justify-content: center; align-items: center; font-weight: bold; color: white; text-transform: uppercase; }
        .list-details { flex: 1; }
        .list-title { font-size: 15px; font-weight: bold; }
        .list-subtitle { font-size: 13px; color: var(--text-muted); }
        
        .chat-container { display: flex; flex-direction: column; height: calc(100vh - 140px); }
        .chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 10px; }
        .message { max-width: 80%; padding: 12px; border-radius: 15px; font-size: 14px; word-wrap: break-word; position: relative; }
        .message.my { background: var(--accent); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .message.other { background: var(--bg-card); color: var(--text-main); align-self: flex-start; border-bottom-left-radius: 2px; }
        .chat-input-area { display: flex; align-items: center; padding: 10px; background: var(--bg-nav); border-top: 1px solid var(--border-color); gap: 8px; }
        .chat-input { flex: 1; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; padding: 12px 15px; color: var(--text-main); outline: none; font-size: 14px; }
        .send-btn { background: var(--accent); color: white; border: none; padding: 10px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; }

        /* PROFILE */
        .profile-card { background: var(--bg-card); border-radius: 15px; padding: 20px; text-align: center; margin-bottom: 15px; }
        .profile-avatar { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--accent); object-fit: cover; }
        .profile-name { font-size: 20px; font-weight: bold; }
        .profile-bio { color: var(--text-muted); font-size: 14px; margin-top: 5px; }
        
        /* MODAL */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; display: none; justify-content: center; align-items: center; }
        .modal-overlay.open { display: flex; }
        .modal-content { background: var(--bg-card); width: 90%; max-width: 400px; padding: 25px; border-radius: 15px; text-align: center; max-height: 80vh; overflow-y: auto; }
        .modal-content h3 { margin-bottom: 20px; color: var(--accent); }
        .modal-content input, .modal-content textarea { width: 100%; padding: 12px; margin-bottom: 15px; background: var(--bg-body); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); outline: none; }
        .modal-btns { display: flex; gap: 10px; }
        .modal-btns button { flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .btn-cancel { background: #444; color: white; }
        .btn-post { background: var(--accent); color: white; }
        .hidden-input { display: none; }
    </style>
</head>
<body>
    <div id="app-container">
        <div style="display:flex; justify-content:center; align-items:center; height:100vh; font-size:20px; color:var(--accent);">Loading Circlo...</div>
    </div>

    <!-- FIREBASE SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

    <script>
        // ==========================================
        // YOUR FIREBASE CONFIGURATION
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyA3cPGmofnbLqIGO8DVoVrQbDEHEyu6pH4",
            authDomain: "circlo-app-d46d4.firebaseapp.com",
            projectId: "circlo-app-d46d4",
            storageBucket: "circlo-app-d46d4.firebasestorage.app",
            messagingSenderId: "279175597181",
            appId: "1:279175597181:web:31a400d6c6f8fb8c96b514"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();

        let currentUser = null; 
        let isLoginMode = true;
        let currentTab = 'home';
        let currentDMUser = null; 
        let historyStack = [];
        let unsubscribeMessages = null; 
        let unsubscribeFeed = null;
        let unsubscribeUsers = null; // NEW: Listener for the user list
        let allUsersList = []; // NEW: Store users for searching

        // Authentication State Listener
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                const userDoc = await db.collection('users').doc(user.uid).get();
                if (userDoc.exists) {
                    currentUser = { uid: user.uid, ...userDoc.data() };
                    renderMainApp();
                } else {
                    currentUser = { uid: user.uid, username: user.email.split('@')[0], fullname: "New User", avatar: 'https://via.placeholder.com/150' };
                    renderMainApp();
                }
            } else {
                currentUser = null;
                renderAuth();
            }
        });

        const root = document.getElementById('app-container');

        // --- AUTHENTICATION ---
        function renderAuth() {
            root.innerHTML = `
                <div class="auth-container">
                    <div class="auth-logo">Circlo</div>
                    <div class="auth-tabs">
                        <div class="auth-tab ${isLoginMode ? 'active' : ''}" onclick="toggleAuthMode(true)">Log In</div>
                        <div class="auth-tab ${!isLoginMode ? 'active' : ''}" onclick="toggleAuthMode(false)">Sign Up</div>
                    </div>
                    <div id="auth-error" class="auth-error"></div>
                    <form onsubmit="handleAuth(event)">
                        ${!isLoginMode ? `<div class="form-group"><label>Full Name</label><input type="text" id="fullname" placeholder="e.g. John Doe" required></div>` : ''}
                        <div class="form-group"><label>Username</label><input type="text" id="username" placeholder="e.g. EcoWarrior" required></div>
                        <div class="form-group"><label>Email</label><input type="email" id="email" placeholder="e.g. user@gmail.com" required></div>
                        <div class="form-group"><label>Password</label><input type="password" id="password" placeholder="Min 6 chars" required></div>
                        ${!isLoginMode ? `<div class="form-group"><label>Confirm Password</label><input type="password" id="confirm-password" placeholder="Confirm password" required></div>` : ''}
                        <button type="submit" class="auth-btn" id="auth-btn">${isLoginMode ? 'Log In' : 'Create Account'}</button>
                    </form>
                </div>`;
        }

        function toggleAuthMode(loginMode) { isLoginMode = loginMode; renderAuth(); }

        async function handleAuth(event) {
            event.preventDefault();
            const errorDiv = document.getElementById('auth-error'); errorDiv.style.display = 'none';
            const btn = document.getElementById('auth-btn'); btn.disabled = true; btn.innerText = 'Please wait...';
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const username = document.getElementById('username').value.trim();

            try {
                if (isLoginMode) {
                    await auth.signInWithEmailAndPassword(email, password);
                } else {
                    if (password !== document.getElementById('confirm-password').value) throw new Error("Passwords do not match.");
                    if (password.length < 6) throw new Error("Password must be at least 6 characters.");
                    
                    const usernameCheck = await db.collection('users').where('username', '==', username).get();
                    if (!usernameCheck.empty) throw new Error("Username is already taken.");

                    const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                    
                    await db.collection('users').doc(userCredential.user.uid).set({
                        username: username,
                        fullname: document.getElementById('fullname').value.trim(),
                        email: email,
                        avatar: 'https://via.placeholder.com/150',
                        bio: "🌱 New to Circlo!"
                    });
                }
            } catch (error) {
                errorDiv.innerText = error.message; errorDiv.style.display = 'block';
                btn.disabled = false; btn.innerText = isLoginMode ? 'Log In' : 'Create Account';
            }
        }

        // --- MAIN LAYOUT ---
        function renderMainApp() {
            root.innerHTML = `
                <div class="header">
                    <div class="header-left">
                        <button class="back-btn" id="global-back-btn" onclick="goBack()">←</button>
                        <div class="header-title" id="header-title-text">Circlo</div>
                    </div>
                    <div class="header-icons"><span onclick="logout()" title="Log Out">🚪</span></div>
                </div>
                <div id="main-view">
                    <div id="view-home" class="view-section active"></div>
                    <div id="view-chat" class="view-section"></div>
                    <div id="view-profile" class="view-section"></div>
                </div>
                <nav class="bottom-nav">
                    <div class="nav-item active" onclick="switchTab('home')" id="nav-home"><span class="nav-icon">🏠</span><span>Home</span></div>
                    <div class="nav-item nav-add" onclick="openAddModal()"><div class="add-circle">+</div></div>
                    <div class="nav-item" onclick="switchTab('chat')" id="nav-chat"><span class="nav-icon">💬</span><span>Chat</span></div>
                    <div class="nav-item" onclick="switchTab('profile')" id="nav-profile"><span class="nav-icon">👤</span><span>Profile</span></div>
                </nav>`;
            switchTab('home'); 
        }

        function switchTab(tab, addToHistory = true) {
            if (currentTab === tab && tab !== 'chat') return; 
            if (addToHistory) { if (['home', 'chat', 'profile'].includes(tab)) historyStack = []; else historyStack.push(currentTab); }
            currentTab = tab; 
            
            // Clean up listeners when switching tabs
            if (tab !== 'chat' && unsubscribeMessages) { unsubscribeMessages(); unsubscribeMessages = null; }
            if (tab !== 'chat' && unsubscribeUsers) { unsubscribeUsers(); unsubscribeUsers = null; }
            if (tab !== 'home' && unsubscribeFeed) { unsubscribeFeed(); unsubscribeFeed = null; }

            const titles = { 'home': 'Circlo', 'chat': 'Messages', 'profile': 'My Profile' };
            document.getElementById('header-title-text').innerText = titles[tab] || 'Circlo';
            document.getElementById('global-back-btn').style.display = (historyStack.length > 0 && tab !== 'home') ? 'block' : 'none';
            
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if(document.getElementById('nav-' + tab)) document.getElementById('nav-' + tab).classList.add('active');
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            if(document.getElementById('view-' + tab)) document.getElementById('view-' + tab).classList.add('active');
            
            if (tab === 'home') renderHomeView();
            if (tab === 'chat') { currentDMUser = null; renderChatView(); }
            if (tab === 'profile') renderProfileView();
        }

        function goBack() {
            if (currentDMUser) { currentDMUser = null; renderChatView(); return; }
            if (historyStack.length > 0) { switchTab(historyStack.pop(), false); }
        }

        function logout() { auth.signOut(); }

        // --- REAL-TIME FEED ---
        function renderHomeView() {
            document.getElementById('view-home').innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:20px;">Loading Feed...</div>`;
            
            if (unsubscribeFeed) unsubscribeFeed();
            
            unsubscribeFeed = db.collection('posts').orderBy('timestamp', 'desc').onSnapshot(snapshot => {
                let html = '';
                if (snapshot.empty) {
                    html = `<div style="text-align:center; padding:40px 20px; color:var(--text-muted);">No posts yet. Click the + button to post something!</div>`;
                } else {
                    snapshot.forEach(doc => {
                        const post = doc.data();
                        html += `
                            <div class="post-card">
                                <div class="post-header">
                                    <div class="post-avatar">${post.username[0]}</div>
                                    <div class="post-user-info">
                                        <strong>@${post.username}</strong>
                                        <span style="font-size:12px; color:var(--text-muted);">Just now</span>
                                    </div>
                                </div>
                                ${post.imageUrl ? `<div class="post-media-single"><img src="${post.imageUrl}" alt="Post Image"></div>` : ''}
                                <div class="post-actions">
                                    <button class="action-btn">🤍 <span style="font-size:14px; font-weight:bold;">0</span></button>
                                    <button class="action-btn">💬 <span style="font-size:14px; font-weight:bold;">0</span></button>
                                </div>
                                <div class="post-info">
                                    <h4>${post.title}</h4>
                                    <p>${post.desc}</p>
                                </div>
                            </div>`;
                    });
                }
                document.getElementById('view-home').innerHTML = html;
            });
        }

        // --- CREATE POST WITH IMAGE UPLOAD ---
        function openAddModal() {
            const modal = document.createElement('div'); modal.className = 'modal-overlay open'; modal.id = 'add-modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <h3>Create a Post</h3>
                    <input type="text" id="post-title" placeholder="Title" required>
                    <textarea id="post-desc" placeholder="Description"></textarea>
                    <div class="form-group" style="text-align:left;">
                        <input type="file" id="post-file" accept="image/*" style="padding:10px; font-size:12px;">
                    </div>
                    <div class="modal-btns">
                        <button class="btn-cancel" onclick="document.getElementById('add-modal').remove()">Cancel</button>
                        <button class="btn-post" id="submit-post-btn" onclick="submitPost()">Post</button>
                    </div>
                </div>`;
            document.body.appendChild(modal);
        }

        async function submitPost() {
            const title = document.getElementById('post-title').value;
            const desc = document.getElementById('post-desc').value;
            const fileInput = document.getElementById('post-file');
            const btn = document.getElementById('submit-post-btn');

            if (!title) { alert("Enter a title."); return; }
            
            btn.disabled = true; btn.innerText = 'Uploading...';
            let imageUrl = null;

            try {
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const storageRef = storage.ref(`posts/${Date.now()}_${file.name}`);
                    const snapshot = await storageRef.put(file);
                    imageUrl = await snapshot.ref.getDownloadURL(); 
                }

                await db.collection('posts').add({
                    username: currentUser.username,
                    title: title,
                    desc: desc,
                    imageUrl: imageUrl,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                document.getElementById('add-modal').remove();
                switchTab('home'); 
            } catch (error) {
                console.error(error);
                alert("Error creating post: " + error.message);
                btn.disabled = false; btn.innerText = 'Post';
            }
        }

        // --- REAL-TIME DMs & USER SEARCH ---
        function renderChatView() {
            if (currentDMUser) return renderActiveDM();
            
            document.getElementById('view-chat').innerHTML = `
                <h3 style="margin-bottom:15px;">Messages</h3>
                <input type="text" class="search-bar" id="dm-search" placeholder="Search users by name or @username..." oninput="filterUsers(this.value)">
                <div id="chat-list-container">Loading users...</div>
            `;
            
            if (unsubscribeUsers) unsubscribeUsers();

            // REAL-TIME LISTENER: Automatically fetches new users as they sign up
            unsubscribeUsers = db.collection('users').onSnapshot(snapshot => {
                allUsersList = [];
                snapshot.forEach(doc => {
                    if (doc.id !== currentUser.uid) {
                        allUsersList.push({ uid: doc.id, ...doc.data() });
                    }
                });
                filterUsers(''); // Render initially
            });
        }

        // NEW: Search functionality for the Chat list
        function filterUsers(query) {
            const container = document.getElementById('chat-list-container');
            const lowerQuery = query.toLowerCase();
            let html = `<h4 style="margin-bottom:10px; color:var(--text-muted); font-size:14px;">All Users (${allUsersList.length})</h4>`;
            let found = false;

            allUsersList.forEach(user => {
                const matchName = user.fullname.toLowerCase().includes(lowerQuery);
                const matchUsername = user.username.toLowerCase().includes(lowerQuery);
                
                if (matchName || matchUsername) {
                    found = true;
                    html += `
                        <div class="list-item" onclick="openDM('${user.uid}', '${user.username}')">
                            <div class="list-avatar">${user.username[0]}</div>
                            <div class="list-details">
                                <div class="list-title">@${user.username}</div>
                                <div class="list-subtitle">${user.fullname}</div>
                            </div>
                        </div>`;
                }
            });

            if (!found) {
                html = `<div style="text-align:center; color:var(--text-muted); padding:20px;">No users found matching "${query}"</div>`;
            }
            container.innerHTML = html;
        }

        function openDM(uid, username) {
            currentDMUser = { uid: uid, username: username };
            historyStack.push('chat');
            renderActiveDM();
        }

        function renderActiveDM() {
            document.getElementById('header-title-text').innerText = `@${currentDMUser.username}`;
            document.getElementById('global-back-btn').style.display = 'block';
            const chatId = [currentUser.uid, currentDMUser.uid].sort().join('_');

            document.getElementById('view-chat').innerHTML = `
                <div class="chat-container">
                    <div class="chat-list" id="dm-chat-list"><div style="text-align:center; padding:20px;">Loading...</div></div>
                    <div class="chat-input-area">
                        <input type="text" class="chat-input" id="dm-chat-input" placeholder="Type a message..." onkeypress="handleDMKeyPress(event)">
                        <button class="send-btn" onclick="sendDMMessage('${chatId}')">➤</button>
                    </div>
                </div>`;

            if (unsubscribeMessages) unsubscribeMessages();
            unsubscribeMessages = db.collection('dms').doc(chatId).collection('messages')
                .orderBy('timestamp', 'asc')
                .onSnapshot(snapshot => {
                    let messagesHtml = '';
                    if (snapshot.empty) messagesHtml = `<div style="text-align:center; color:var(--text-muted); padding:20px;">Say hello!</div>`;
                    else {
                        snapshot.forEach(doc => {
                            const msg = doc.data();
                            const isMe = msg.senderId === currentUser.uid;
                            messagesHtml += `<div class="message ${isMe ? 'my' : 'other'}"><div style="font-size:10px; margin-bottom:3px;">@${msg.senderUsername}</div>${msg.text}</div>`;
                        });
                    }
                    const list = document.getElementById('dm-chat-list');
                    list.innerHTML = messagesHtml;
                    list.scrollTop = list.scrollHeight; 
                });
        }

        async function sendDMMessage(chatId) {
            const input = document.getElementById('dm-chat-input');
            if (!input.value.trim()) return;
            const text = input.value.trim();
            input.value = '';
            await db.collection('dms').doc(chatId).collection('messages').add({
                text: text, senderId: currentUser.uid, senderUsername: currentUser.username,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        function handleDMKeyPress(event) {
            if (event.key === 'Enter') sendDMMessage([currentUser.uid, currentDMUser.uid].sort().join('_'));
        }

        // --- PROFILE ---
        function renderProfileView() {
            document.getElementById('view-profile').innerHTML = `
                <div class="profile-card">
                    <img src="${currentUser.avatar}" class="profile-avatar">
                    <div class="profile-name">${currentUser.fullname}</div>
                    <div class="profile-bio">@${currentUser.username} • ${currentUser.bio}</div>
                </div>
            `;
        }
    </script>
</body>
</html>
